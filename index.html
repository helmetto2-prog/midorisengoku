function idxOf(n){ return PROV.findIndex(p=>p.n===n); }
// 特別な国（名→種別）：京=上洛地, 堺=交易/鉄砲安, 銀山/金山=金, 港=交易
const SP_DEF={山城:'京',和泉:'堺',石見:'銀山',甲斐:'金山',筑前:'港',駿河:'港',越後:'港'};

const KYOTO_I=+Object.keys(SPECIAL).find(k=>SPECIAL[k]==='京');
// 隣接は座標から自動生成（近傍）＋海を渡る航路
const EDGES=(function(){
  const set=new Set(), key=(a,b)=>a<b?a+','+b:b+','+a;
  for(let i=0;i<PROV.length;i++){ const ds=[];
    for(let j=0;j<PROV.length;j++) if(j!==i) ds.push([j,Math.hypot(PROV[i].x-PROV[j].x,PROV[i].y-PROV[j].y)]);
    ds.sort((a,b)=>a[1]-b[1]);
    for(let m=0;m<Math.min(5,ds.length);m++){ if(ds[m][1]<82) set.add(key(i,ds[m][0])); } }
  [['豊前','長門'],['筑前','長門'],['伊予','周防'],['伊予','豊後'],['讃岐','備前'],['阿波','和泉'],['阿波','紀伊'],['佐渡','越後'],['伊豆','相模']]
    .forEach(([a,b])=>{ const i=idxOf(a),j=idxOf(b); if(i>=0&&j>=0) set.add(key(i,j)); });
  return [...set].map(s=>s.split(',').map(Number));
})();
const ADJ=PROV.map(()=>[]);
EDGES.forEach(([a,b])=>{ ADJ[a].push(b); ADJ[b].push(a); });
// 列島を地図領域いっぱいに自動フィット（隣接は上で確定済みなので座標だけ拡大）
(function fitMap(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  PROV.forEach(p=>{ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); });
  const L=28,R=MAPW-42,T=50,B=H-100, sx=(R-L)/(x1-x0), sy=(B-T)/(y1-y0);
  PROV.forEach(p=>{ p.x=Math.round(L+(p.x-x0)*sx); p.y=Math.round(T+(p.y-y0)*sy); });
})();
function makePoly(p,seed){ const pts=[],N=11; for(let k=0;k<N;k++){ const a=k/N*TAU; const r=22+8*Math.sin(seed*1.7+k*1.3)+5*Math.cos(seed*0.9+k*2.1); pts.push([p.x+Math.cos(a)*r, p.y+Math.sin(a)*r]); } return pts; }
PROV.forEach((p,i)=>{ p.poly=makePoly(p,i); });

 [['伊達晴宗',74,74,74,72,''],['鬼庭良直',78,82,72,70,'勇将'],['伊達実元',76,78,72,68,'']]

// ── 状態 ───────────────────────────────────────────────────
let state='title', busy=false, G=null, sel=-1, phase='cmd', fromP=-1;
const UI={ btns:[], end:null, daimyo:[], cont:null };
let mouse={x:0,y:0};

function newGame(playerFac){
  const prov=PROV.map(()=>({owner:-1,農業:0,商業:0,治水:0,城:0,民忠:0,兵:0,訓練:0,鉄砲:0,石高:0,人口:0,gen:null,兵種:'足軽'}));

  DAIMYO.forEach((d,f)=> d.start.forEach((pi,k)=>{
    const pr=prov[pi]; pr.owner=f; const home=(k===0);
    pr.農業=Math.round(ri(32,58)); pr.商業=Math.round(ri(28,55)); pr.治水=Math.max(20,Math.round(ri(25,45)));
    pr.石高=Math.round(ri(38,72)); pr.人口=Math.round(ri(10,24)+pr.石高*0.18);
    pr.城=Math.round(home?ri(55,72):ri(35,55)); pr.民忠=Math.round(ri(56,72));

  for(let i=0;i<PROV.length;i++){ const pr=prov[i]; if(pr.owner>=0) continue;

  const fac=DAIMYO.map(()=>({ gold:Math.round(ri(1400,2200)), food:Math.round(ri(3000,4600)), reserve:[], 上洛:false }));
  DAIMYO.forEach((d,f)=>{ const gs=GENS[f].map(g=>({name:g[0],lead:g[1],war:g[2],int:g[3],pol:g[4],skill:g[5]||'',loy:90}));
    if(gs[0]){ gs[0].isLord=true; gs[0].loy=100; }   // 当主＝大将
    gs.forEach((g,i)=>{ if(i<d.start.length) prov[d.start[i]].gen=g; else fac[f].reserve.push(g); }); });
  DAIMYO[11].start.forEach(pi=>prov[pi].兵種='騎馬');   // 武田＝騎馬軍団
  prov[38].兵種='鉄砲隊';                                // 織田の尾張＝鉄砲隊
  const N=DAIMYO.length, rel=[], ally=[];
  for(let a=0;a<N;a++){ rel.push(Array(N).fill(0)); ally.push(Array(N).fill(false)); }
  for(let a=0;a<N;a++) for(let b=a+1;b<N;b++){ const v=Math.round(ri(-25,15)); rel[a][b]=rel[b][a]=v; }
  G={ prov, fac, player:playerFac, year:1560, season:0, ap:0, log:[], rel, ally, shocks:[], kin:DAIMYO.map(()=>DAIMYO.map(()=>false)), histDone:{} };
  G.ap=playerAP();
  pushLog('— '+DAIMYO[playerFac].n+'家、天下統一を目指せ！ 灰色の独立勢力を従え、富国強兵し隣国へ出陣せよ。');
  sel=-1; phase='cmd'; fromP=-1;

// ── ヘルパ ───────────────────────────────────────────────
const provsOf=f=>{ const a=[]; for(let i=0;i<PROV.length;i++) if(G.prov[i].owner===f) a.push(i); return a; };
function hasGenName(f,nm){ for(const i of provsOf(f)){ const g=G.prov[i].gen; if(g&&g.name===nm) return true; } return G.fac[f].reserve.some(g=>g.name===nm); }
function facOfGen(nm){ for(let f=0;f<DAIMYO.length;f++){ if(aliveFac(f)&&hasGenName(f,nm)) return f; } return -1; }
function removeGenByName(nm){ for(let f=0;f<DAIMYO.length;f++){ for(const i of provsOf(f)){ if(G.prov[i].gen&&G.prov[i].gen.name===nm){ G.prov[i].gen=null; return f; } } const ix=G.fac[f].reserve.findIndex(g=>g.name===nm); if(ix>=0){ G.fac[f].reserve.splice(ix,1); return f; } } return -1; }
const genLoy=g=>(g.loy==null?80:g.loy);
// 武将成長：勝ち戦で武勇（時に統率）が伸びる
function growGen(g,won,isPlayer){ if(!g) return;
  if(won){ if(g.war<99){ g.war++; if(isPlayer) pushLog('⤴ '+g.name+'の武勇が上がった（'+g.war+'）'); } if(Math.random()<0.5) g.lead=Math.min(99,g.lead+1); }
  else if(Math.random()<0.35) g.war=Math.min(99,g.war+1); }
const aliveFac=f=> provsOf(f).length>0;
const provGen=pr=> pr.gen||DEFGEN;
function holdsSpecial(f,sp){ for(const k in SPECIAL){ if(SPECIAL[k]===sp && G.prov[+k].owner===f) return true; } return false; }
function gunCostFor(f){ return Math.round((f===9?450:BAL.cmdGun)*(holdsSpecial(f,'堺')?0.6:1)); }
const devCap=pr=>Math.min(100,44+pr.治水*0.62);   // 治水が高いほど開墾の上限が伸びる

// ── 内政コマンド ─────────────────────────────────────────
async function doCmd(key){
  if(busy||sel<0||G.prov[sel].owner!==G.player) return;
  if(key==='attack'||key==='move'||key==='surrender'){
    if(G.ap<=0){ pushLog('行動回数がない。ターン終了を。'); SFX.deny(); return; }
    phase=key; fromP=sel; SFX.sel();
    pushLog(key==='attack'?'出陣先の隣の敵国を選べ':key==='move'?'移動先の隣の自国を選べ':'降伏を迫る隣国を選べ（兵が3倍以上で圧迫）'); return;
  }
  if(key==='joraku'){ const Fj=G.fac[G.player];
    if(sel!==KYOTO_I||G.prov[KYOTO_I].owner!==G.player){ pushLog('京（山城）を治めねば上洛できぬ'); SFX.deny(); return; }
    if(Fj.上洛){ pushLog('既に上洛済み'); return; }
    if(Fj.gold<1500){ noGold(); return; } if(G.ap<=0){ pushLog('行動回数がない'); SFX.deny(); return; }
    Fj.gold-=1500; Fj.上洛=true; G.ap--; for(const i of provsOf(G.player)) G.prov[i].民忠=clamp(G.prov[i].民忠+15,0,100);
    pushLog('★ 上洛成功！朝廷の威光で全国の民忠↑・金収入+20%'); SFX.fanfare(); return; }
  // 米相場での売買（行動回数を消費しない）
  if(key==='sell'||key==='buy'){ const F2=G.fac[G.player], price=ricePrice();
    if(key==='sell'){ if(F2.food<RICE_LOT){ pushLog('売る米が足りない'); SFX.deny(); return; } const g=Math.round(RICE_LOT*price); F2.food-=RICE_LOT; F2.gold+=g; pushLog('米'+RICE_LOT+'石を売却（相場'+price.toFixed(2)+'）金+'+g); SFX.cmd(); }
    else { const c2=Math.round(RICE_LOT*price*1.25); if(F2.gold<c2){ noGold(); return; } F2.gold-=c2; F2.food+=RICE_LOT; pushLog('米'+RICE_LOT+'石を購入（相場'+price.toFixed(2)+'）金-'+c2); SFX.cmd(); }
    return; }
  // 控えの武将を守将に配置（行動回数を消費しない）
  if(key==='assign'){ const F2=G.fac[G.player], pr2=G.prov[sel]; if(!F2.reserve.length){ pushLog('控えの武将がいない'); SFX.deny(); return; }
    F2.reserve.sort((a,b)=>(b.lead+b.war)-(a.lead+a.war)); const best=F2.reserve[0];
    if(pr2.gen && (pr2.gen.lead+pr2.gen.war)>=(best.lead+best.war)){ pushLog('控えに今の守将より優れた者はいない'); SFX.deny(); return; }
    const old=pr2.gen; pr2.gen=F2.reserve.shift(); if(old) F2.reserve.push(old);
    pushLog('⚑ '+PROV[sel].n+'の守将に '+pr2.gen.name+'（統'+pr2.gen.lead+'/武'+pr2.gen.war+'）を配置'); SFX.fanfare(); return; }
  // 恩賞：守将の忠誠を上げる（行動回数を消費しない）
  if(key==='reward'){ const F2=G.fac[G.player], pr2=G.prov[sel];
    if(!pr2.gen){ pushLog('守将がいない'); SFX.deny(); return; }
    if(pr2.gen.isLord){ pushLog('大将に恩賞は不要（忠誠100）'); SFX.deny(); return; }
    if(F2.gold<200){ noGold(); return; }
    F2.gold-=200; pr2.gen.loy=clamp(genLoy(pr2.gen)+15,0,100);
    pushLog('🎁 '+pr2.gen.name+'に恩賞を与えた（忠誠'+pr2.gen.loy+'）'); SFX.cmd(); return; }
  // 兵種切替：足軽→騎馬（要訓練40）→鉄砲隊（要鉄砲100）を巡回（行動回数を消費しない）
  if(key==='troop'){ const pr2=G.prov[sel], order=['足軽','騎馬','鉄砲隊'];
    let cur=pr2.兵種||'足軽';
    for(let k2=0;k2<3;k2++){ cur=order[(order.indexOf(cur)+1)%3];
      if(cur==='騎馬'&&pr2.訓練<40) continue;
      if(cur==='鉄砲隊'&&pr2.鉄砲<100) continue;
      if(cur===(pr2.兵種||'足軽')) break;
      pr2.兵種=cur; pushLog(PROV[sel].n+'を『'+cur+'』に編成替え（騎馬:突撃強化／鉄砲隊:射撃強化／足軽:守り堅い）'); SFX.cmd(); return; }
    pushLog('編成替え不可（騎馬=訓練40・鉄砲隊=鉄砲100が必要）'); SFX.deny(); return; }
  if(G.ap<=0){ pushLog('行動回数がない。ターン終了を。'); SFX.deny(); return; }
  const F=G.fac[G.player], pr=G.prov[sel], pol=provGen(pr).pol;
  const cost=(key==='gun')?gunCostFor(G.player):({dev:BAL.cmdDev,comm:BAL.cmdComm,flood:BAL.cmdFlood,levy:BAL.cmdLevy,train:BAL.cmdTrain,castle:BAL.cmdCastle,alms:BAL.cmdAlms}[key]);
  if(cost==null) return;
  if(F.gold<cost){ noGold(); return; }
  if(key==='levy'&&F.food<200){ pushLog('兵糧が足りない'); SFX.deny(); return; }
  F.gold-=cost; if(key==='levy') F.food-=200; G.ap--;
  const oc=rollOutcome(pol, pr.民忠); let m=(oc==='great'?1.8:oc==='fail'?0.25:1.0); if(provGen(pr).skill==='内政') m*=1.4;
  busy=true; G.scene={key,oc,prov:sel,t0:clock()}; SFX.cmd();
  await sleep(1150);
  let detail='';
  switch(key){
    case 'dev':   { const pb=0.8+pol/250; pr.農業=clamp(Math.round(pr.農業+ri(8,12)*m*pb),0,devCap(pr)); if(oc!=='fail'&&Math.random()<0.6){ pr.石高=clamp(pr.石高+(oc==='great'?2:1),0,130); } detail='農業'+pr.農業+' 石高'+pr.石高; } break;
    case 'comm':  { const pb=0.8+pol/250; pr.商業=clamp(Math.round(pr.商業+ri(8,12)*m*pb),0,100); detail='商業'+pr.商業; } break;
    case 'flood': { const pb=0.8+pol/250; pr.治水=clamp(Math.round(pr.治水+ri(6,10)*m*pb),0,100); detail='治水'+pr.治水+'（開墾上限'+Math.round(devCap(pr))+'）'; } break;
    case 'levy':  { const cap=Math.round(pr.人口*150); const want=Math.round((pr.石高+pr.農業*0.5)*2.0*m+pr.人口*28*m); const add=Math.max(0,Math.min(want,cap-pr.兵)); pr.兵+=add; pr.民忠=clamp(pr.民忠-9,0,100); pr.人口=clamp(pr.人口-Math.round(add/400),4,999); detail=(add>0?'兵+'+add:'人口上限で徴兵できず'); } break;
    case 'train': pr.訓練=clamp(Math.round(pr.訓練+ri(6,11)*m*(0.8+provGen(pr).war/250)),0,100); detail='訓練'+pr.訓練; break;
    case 'castle':pr.城=clamp(Math.round(pr.城+ri(5,9)*m),0,100); detail='城'+pr.城; break;
    case 'gun':   { const add=Math.round(100*m); pr.鉄砲+=add; detail='鉄砲+'+add; } break;
    case 'alms':  pr.民忠=clamp(Math.round(pr.民忠+ri(8,13)*m),0,100); detail='民忠'+pr.民忠; break;
  }
  const ocTxt=oc==='great'?'大成功':oc==='fail'?'失敗':'成功';
  pushLog(PROV[sel].n+'の'+CMDNAME[key]+'：'+ocTxt+'（'+detail+'）');
  G.scene=null; busy=false; if(oc==='great') SFX.fanfare();
}

    else { G.rel[p][o]=G.rel[o][p]=clamp(G.rel[p][o]-25,-100,100); pushLog('同盟を破棄した（'+DAIMYO[o].n+'家）'); } SFX.deny(); }

// ── 合戦 ───────────────────────────────────────────────────
// 準備（勝敗はまだ決めない。一騎討ちの発生だけ決めて、勝者はアクション後に確定）
function battleSetup(from,to,frac,atk,dft,wx){
  const a=G.prov[from], d=G.prov[to];
  const sent=Math.max(1,Math.floor(a.兵*frac)), keep=a.兵-sent;
  const ag=provGen(a), dg=provGen(d);
  const duel=(a.gen&&d.gen&&Math.random()<0.32)?{winner:null,kill:false}:null;
  return {from,to,af:a.owner,df:d.owner,sent,keep,ag,dg,defTroops:d.兵,atk,dft,wx,duel,
          aT:(a.兵種||'足軽'), dT:(d.兵種||'足軽'), siege:(d.城>=60)};
}
// 一騎討ちの決着。biasはプレイヤーの見切りアクション補正（side='a'/'d'＝プレイヤー側）
function resolveDuel(s,bias,side){
  const pw=g=>(g.war+g.lead*0.3)*(g.skill==='猛将'?1.15:g.skill==='勇将'?1.08:g.skill==='天下布武'?1.05:1);
  const aw=pw(s.ag), dw=pw(s.dg); let pA=aw*aw/(aw*aw+dw*dw);
  if(bias) pA=clamp(side==='d'?pA-bias:pA+bias,0.05,0.95);
  s.duel.winner=Math.random()<pA?'a':'d'; s.duel.kill=Math.random()<0.35;
}
// 決着計算。mods={meP:プレイヤー側('a'/'d'), actMul:斉射＋連打アクションの補正}
function battleResolve(s,mods){
  mods=mods||{};
  const a=G.prov[s.from], d=G.prov[s.to], sent=s.sent, ag=s.ag, dg=s.dg;
  if(s.duel&&!s.duel.winner) resolveDuel(s,0);
  const tt=PROV[s.to].t, terr=TERR[tt]||1, gunW=(s.wx==='雨')?0.4:1.0, tm=tacticMult(s.atk,s.dft);
  const gunA=((ag.skill==='天下布武')?1.6:1)*(s.aT==='鉄砲隊'?1.35:1), gunD=((dg.skill==='天下布武')?1.6:1)*(s.dT==='鉄砲隊'?1.35:1);   // 三段撃ち・鉄砲隊
  const duelA=s.duel?(s.duel.winner==='a'?1.18:0.86):1, duelD=s.duel?(s.duel.winner==='d'?1.18:0.86):1;
  const attMul=(mods.meP==='a')?(mods.actMul||1):1, defMul=(mods.meP==='d')?(mods.actMul||1):1;
  // 兵種補正：騎馬＝突撃強化（山岳は苦手）、足軽＝守りが堅い
  let typeA=1, typeD=1;
  if(s.aT==='騎馬'){ if(s.atk==='突撃') typeA*=1.18; if(tt==='山岳') typeA*=0.92; }
  if(s.dT==='騎馬'&&s.dft==='突撃') typeD*=1.15;
  if(s.dT==='足軽') typeD*=1.08;
  const attP=sent*(0.5+a.訓練/200)*(1+(ag.lead+ag.war)/240)*presenceMul(a.gen)*(1+Math.min(0.5,a.鉄砲/(sent+1))*0.5*gunW*gunA)*tm*genCombatMul(ag,tt,s.atk)*typeA*duelA*attMul*ri(0.85,1.15);
  const defP=d.兵*(0.5+d.訓練/200)*(1+(dg.lead+dg.war)/240)*presenceMul(d.gen)*(1+Math.min(0.5,d.鉄砲/(d.兵+1))*0.5*gunW*gunD)*terr*(1+d.城/100*(mods.gateBroken?0.25:0.5))*genCombatMul(dg,tt,s.dft)*typeD*duelD*defMul*ri(0.85,1.15);
  const attWin=attP>=defP; let attSurv=0,defSurv=0;
  if(attWin) attSurv=Math.max(Math.floor(sent*0.2),Math.floor(sent*(0.35+0.5*(attP-defP)/attP)));
  else defSurv=Math.max(Math.floor(d.兵*0.3),Math.floor(d.兵*(1-attP/defP*0.5)));
  return Object.assign(s,{attP,defP,attWin,attSurv,defSurv});
}
// AI同士など即時解決用（従来互換）
function computeBattle(from,to,frac,atk,dft,wx){ return battleResolve(battleSetup(from,to,frac,atk,dft,wx)); }
function applyBattle(r){
  const a=G.prov[r.from], d=G.prov[r.to];
  if(r.duel){ const wg=r.duel.winner==='a'?r.ag:r.dg, lp=r.duel.winner==='a'?d:a;
    if(r.duel.kill&&lp.gen){ pushLog('⚔ 一騎討ち！ '+wg.name+' が '+lp.gen.name+' を討ち取った！'); lp.gen=null; }
    else pushLog('⚔ 一騎討ちは '+wg.name+' に軍配！'); }
  const ga=a.gen, gd=d.gen;   // 成長判定用（移動・捕縛前に確保）
  a.兵=r.keep+(r.attWin?0:Math.floor(r.sent*0.15));
  if(r.attWin){
    if(d.gen){ const gen=d.gen, rr=Math.random();
      if(rr<0.26){ pushLog('武将 '+gen.name+' 討死（'+facName(r.df)+'）'); }
      else if(rr<0.62){ gen.loy=50; G.fac[r.af].reserve.push(gen); pushLog('🤝 '+gen.name+'（統'+gen.lead+'/武'+gen.war+'）を捕らえ '+DAIMYO[r.af].n+'家に登用！（忠誠50…恩賞を忘れずに）'); }
      else if(r.df>=0){ G.fac[r.df].reserve.push(gen); pushLog('武将 '+gen.name+' は落ち延びた'); }
      else { pushLog('武将 '+gen.name+' は逃れ去った'); }
      d.gen=null; }
    d.owner=r.af; d.兵=r.attSurv; d.訓練=a.訓練; d.民忠=30; d.鉄砲=Math.floor(a.鉄砲*0.3);
    d.人口=Math.max(4,Math.round(d.人口*0.85));   // 戦災で人口減
    d.gen=a.gen; a.gen=null;
    pushLog('⚔ '+DAIMYO[r.af].n+'が'+PROV[r.to].n+'を攻略！');
    if(r.df>=0 && !aliveFac(r.df)) pushLog('☓ '+DAIMYO[r.df].n+'家 滅亡！');
  } else {
    d.兵=r.defSurv;
    if(a.gen && Math.random()<0.18){ pushLog('武将 '+a.gen.name+' 討死（'+DAIMYO[r.af].n+'）'); a.gen=null; }
    pushLog('🛡 '+PROV[r.to].n+'は'+facName(r.df)+'が守り切った');
  }
  growGen(ga, r.attWin, r.af===G.player); growGen(gd, !r.attWin, r.df===G.player);   // 戦経験で成長
}
// ── 合戦アクション（自軍が関わる合戦でのミニゲーム）──────
function runAction(type,dur){
  return new Promise(res=>{
    const a={type,t0:clock(),dur,done:false,hits:0,acc:null,pos:null,result:null,_res:res};
    G.action=a;
    setTimeout(()=>finishAction(a,(a.type==='melee'||a.type==='gate')?'time':'none'),dur);
  });
}
function finishAction(a,result){
  if(!a||a.done||G.action!==a) return; a.done=true; a.result=result; a.tEnd=clock();
  if(result==='perfect'||result==='full') SFX.event(); else if(result==='miss') SFX.deny();
  setTimeout(()=>{ if(G.action===a) G.action=null; a._res(a); },650);
}
function markerPos(a){ return Math.sin((clock()-a.t0)/(a.type==='duel'?150:230)); }
function actionInput(){
  const a=G.action; if(!a||a.done) return;
  if(a.type==='melee'||a.type==='gate'){ a.hits++; SFX.sel(); if(a.hits>=18) finishAction(a,'full'); return; }
  a.pos=markerPos(a); const acc=1-Math.abs(a.pos); a.acc=acc;
  finishAction(a, acc>0.85?'perfect':acc>0.55?'good':'miss');
}
async function animBattle(from,to,byPlayer,atkTactic){
  const atk=atkTactic||TACTICS[Math.floor(Math.random()*3)];
  const dft=TACTICS[Math.floor(Math.random()*3)];
  const wx=WEATHER[Math.floor(Math.random()*3)];
  const s=battleSetup(from,to,0.8,atk,dft,wx);
  const meP=(s.af===G.player)?'a':(s.df===G.player)?'d':null;   // プレイヤー側ならアクション発動
  let actMul=1, gateBroken=false;
  // 行軍：マップ上で兵がその国から歩いていく
  G.march={from,to,t0:clock()}; SFX.taiko();
  await sleep(1000); G.march=null;
  // 合戦カットイン
  state='battle'; G.battle={r:s,phase:'approach',t0:clock()}; SFX.taiko();
  await sleep(850); G.battle.phase='volley'; G.battle.t0=clock(); SFX.volley();
  if(meP==='a'&&s.siege){ const a=await runAction('gate',3000);   // 攻城戦＝城門破壊連打
    gateBroken=(a.result==='full'); actMul*=1+Math.min(0.2,(a.hits||0)*0.013);
    if(gateBroken) pushLog('🏯 城門を打ち破った！城の守りが弱まる'); }
  else if(meP){ const a=await runAction('volley',2600);
    actMul*= a.result==='perfect'?1.25 : a.result==='good'?1.12 : a.result==='miss'?0.95 : 1; }
  else await sleep(750);
  G.battle.phase='clash'; G.battle.t0=clock(); SFX.taiko();
  await sleep(750);
  if(s.duel){
    G.battle.phase='duel'; G.battle.t0=clock(); SFX.duel();
    let bias=0;
    if(meP){ const a=await runAction('duel',2600);
      bias= a.result==='perfect'?0.35 : a.result==='good'?0.15 : a.result==='miss'?-0.15 : -0.05; }
    else await sleep(900);
    resolveDuel(s,bias,meP);
    G.battle.duelRes=clock(); SFX.clash();
    await sleep(1300);
  }
  G.battle.phase='melee'; G.battle.t0=clock(); SFX.clash();
  if(meP){ const a=await runAction('melee',2600); actMul*=1+Math.min(0.15,(a.hits||0)*0.011); }
  else await sleep(1200);
  const r=battleResolve(s,{meP,actMul,gateBroken});
  G.battle.r=r; G.battle.phase='result'; G.battle.t0=clock(); SFX.clash();
  await sleep(1100);
  applyBattle(r); G.battle=null;
  // 勝敗の拡大画面（プレイヤーが関係する戦のみ）
  if(r.af===G.player || r.df===G.player){
    const won=(r.attWin&&r.af===G.player)||(!r.attWin&&r.df===G.player);
    G.bigResult={won,prov:r.to,t0:clock()}; if(won) SFX.fanfare(); else SFX.lose();
    await sleep(1700); G.bigResult=null;
  }
  state='play';
  if(byPlayer){ G.ap--; sel=(r.attWin?to:from); phase='cmd'; SFX.cmd(); }
  checkEnd();
}

async function doSurrender(from,to){
  const a=G.prov[from], d=G.prov[to], oldOwner=d.owner;
  busy=true; G.envoy={from,to,name:PROV[to].n,foe:facName(oldOwner),phase:'send',res:null,t0:clock()}; SFX.sel();
  await sleep(1300);
  const ratio=a.兵/(d.兵+1);
  const chance=clamp(0.40+(ratio-3)*0.09 - d.城/320 - (d.gen?d.gen.lead/380:0) - (d.民忠-50)/300 + (a.gen?a.gen.lead/900:0) + (a.gen&&a.gen.skill==='天下布武'?0.12:0), 0.08, 0.95);
  const ok=Math.random()<chance;
  G.envoy.phase='result'; G.envoy.res=ok; G.envoy.t0=clock();
  if(ok){ SFX.fanfare();
    if(d.gen && oldOwner>=0 && Math.random()<0.5){ G.fac[oldOwner].reserve.push(d.gen); pushLog('守将 '+d.gen.name+' は退去した'); d.gen=null; }
    else if(d.gen){ d.gen.loy=55; pushLog('守将 '+d.gen.name+' が臣従した（忠誠55）'); }
    d.owner=G.player; d.民忠=38; d.訓練=Math.max(d.訓練, a.訓練-12);
    pushLog('🏳 '+G.envoy.foe+'の'+PROV[to].n+'が降伏！無血開城した');
    if(oldOwner>=0){ G.rel[G.player][oldOwner]=clamp(G.rel[G.player][oldOwner]-10,-100,100); G.rel[oldOwner][G.player]=G.rel[G.player][oldOwner]; if(!aliveFac(oldOwner)) pushLog('☓ '+DAIMYO[oldOwner].n+'家 滅亡！'); }
  } else { SFX.deny();
    d.民忠=clamp(d.民忠+5,0,100);
    pushLog('🏳 '+G.envoy.foe+'は降伏勧告を拒否した');
    if(oldOwner>=0){ G.rel[G.player][oldOwner]=clamp(G.rel[G.player][oldOwner]-6,-100,100); G.rel[oldOwner][G.player]=G.rel[G.player][oldOwner]; }
  }
  await sleep(1600); G.envoy=null;
  G.ap--; sel=(ok?to:from); phase='cmd'; busy=false; checkEnd(); save();
}

async function aiTurn(f){
  if(!aliveFac(f)) return;
  const F=G.fac[f];
  for(let a=0;a<2;a++){ const ps=provsOf(f); if(!ps.length) return;
    const poor=ps.filter(i=>G.prov[i].民忠<42);
    if(F.gold>=BAL.cmdAlms && poor.length){ const p=poor[0]; F.gold-=BAL.cmdAlms; G.prov[p].民忠=clamp(G.prov[p].民忠+12,0,100); }
    else if(F.gold>=BAL.cmdLevy && F.food>300){ const p=ps[Math.floor(Math.random()*ps.length)]; F.gold-=BAL.cmdLevy; F.food-=200; G.prov[p].兵+=Math.round((G.prov[p].石高+G.prov[p].農業)*2.4); G.prov[p].訓練=clamp(G.prov[p].訓練+5,0,100); }
    else if(F.gold>=BAL.cmdDev){ const p=ps[Math.floor(Math.random()*ps.length)], pr=G.prov[p]; F.gold-=BAL.cmdDev; if(Math.random()<0.5)pr.農業=clamp(pr.農業+9,0,devCap(pr)); else pr.商業=clamp(pr.商業+9,0,100); }
    else break;
  }
  for(let a=0;a<2;a++){ if(!aliveFac(f)) return;
    let best=null;
    for(const i of provsOf(f)) for(const j of ADJ[i]){ const o=G.prov[j].owner; if(o===f||G.ally[f][o]) continue;
      const adv=G.prov[i].兵/(G.prov[j].兵+1), score=adv*(o===G.heg?1.3:1); if(G.prov[i].兵>700&&adv>1.2&&(!best||score>best.score)) best={from:i,to:j,adv,score}; }
    if(!best) break;
    if(G.prov[best.to].owner===G.player || G.prov[best.from].owner===G.player){ await animBattle(best.from,best.to,false); }
    else { const t1=TACTICS[Math.floor(Math.random()*3)],t2=TACTICS[Math.floor(Math.random()*3)],w=WEATHER[Math.floor(Math.random()*3)]; applyBattle(computeBattle(best.from,best.to,0.85,t1,t2,w)); checkEnd(); }
    if(state==='over') return;
  }
}

function applyIncome(){ for(let f=0;f<DAIMYO.length;f++){ if(!aliveFac(f))continue; let g=0;
  for(const i of provsOf(f)){ const pr=G.prov[i]; g+=pr.商業*BAL.goldComm*(0.6+pr.人口/40)+pr.石高*BAL.goldKoku; const sp=SPECIAL[i]; if(sp==='銀山'||sp==='金山')g+=600; else if(sp==='堺'||sp==='港')g+=380; else if(sp==='京')g+=250; }
  if(G.fac[f].上洛) g*=1.2;
  if(hasGenName(f,'織田信長')) g*=1.12;   // 天下布武：革新の経済政策（信長が仕える家に恩恵）
  G.fac[f].gold+=Math.round(g); } }
function seasonEvents(){
  if(!G.shocks) G.shocks=[];   // 旧セーブ互換
  for(let f=0;f<DAIMYO.length;f++){ if(!aliveFac(f))continue; const F=G.fac[f], ps=provsOf(f); let tr=0; for(const i of ps) tr+=G.prov[i].兵;
    F.food-=Math.round(tr*BAL.upkeep); F.gold=Math.max(0,F.gold-Math.round(tr*BAL.goldUpkeep));   // 兵糧＋軍費
    if(G.season===2){ let h=0; for(const i of ps) h+=G.prov[i].農業*BAL.harvestA+G.prov[i].石高*BAL.harvestK+G.prov[i].治水*BAL.harvestFlood; F.food+=Math.round(h); }
    if(F.food<0){ for(const i of ps){ G.prov[i].兵=Math.floor(G.prov[i].兵*0.9); G.prov[i].民忠=clamp(G.prov[i].民忠-8,0,100); } F.food=0; if(f===G.player) pushLog('⚠ 兵糧不足！兵が減り民忠が下がった'); }
    F.reserve.forEach(g=>{ if(!g.isLord) g.loy=clamp(genLoy(g)+1,0,100); });   // 控え武将の忠誠は緩やかに回復
  }
  for(let i=0;i<PROV.length;i++){ const pr=G.prov[i]; if(pr.owner<0)continue; pr.民忠=clamp(pr.民忠+2,0,90);
    // 武将の忠誠：平時は+1、民忠低下地は-2。忠誠40未満は出奔の危険（恩賞で回復）
    const gg=pr.gen;
    if(gg&&!gg.isLord){ gg.loy=clamp(genLoy(gg)+(pr.民忠<40?-2:1),0,100);
      if(gg.loy<40&&Math.random()<0.12){ pushLog('🚪 '+gg.name+'が'+facName(pr.owner)+(pr.owner>=0?'家':'')+'を出奔した（忠誠低下）'); if(pr.owner===G.player) G.shocks.push({type:'syuppon',prov:i,gname:gg.name}); pr.gen=null; } }
    // 人口増減：民忠と治水で成長、低民忠で流出（上限は石高・治水に連動）
    const cap=30+pr.石高*0.45+pr.治水*0.35;
    if(pr.民忠>=50) pr.人口=Math.min(cap, pr.人口+(pr.民忠-50)/100*(1+pr.治水/200)*1.3);
    else pr.人口=Math.max(4, pr.人口-(50-pr.民忠)/100*0.9);
    pr.人口=Math.round(pr.人口*10)/10;
    // 民忠を下げすぎると一揆が起こる（百姓一揆→一向一揆→謀反/国一揆）。自国絡みはズーム演出で通知
    if(pr.民忠<33 && Math.random()<0.20){ pr.兵=Math.floor(pr.兵*0.82); pr.人口=Math.max(4,pr.人口-1); pr.民忠=clamp(pr.民忠+8,0,100); if(pr.owner===G.player){ pushLog('🌾 百姓一揆！'+PROV[i].n+'で兵と人口が減った'); G.shocks.push({type:'ikki',prov:i}); } }
    if(pr.民忠<27 && Math.random()<0.16){ pr.兵=Math.floor(pr.兵*0.70); pr.鉄砲=Math.floor(pr.鉄砲*0.85); pr.民忠=clamp(pr.民忠+6,0,100); if(pr.owner===G.player){ pushLog('☸ 一向一揆！'+PROV[i].n+'で門徒が蜂起、兵が激減'); G.shocks.push({type:'ikko',prov:i}); } }
    if(pr.民忠<22 && Math.random()<0.16){ const en=ADJ[i].map(j=>G.prov[j].owner).filter(o=>o>=0&&o!==pr.owner), old=pr.owner;
      if(en.length){ const t=en[Math.floor(Math.random()*en.length)]; pr.owner=t; pr.gen=null; pr.民忠=42; pr.兵=Math.floor(pr.兵*0.7); pushLog('⚑ 謀反！'+PROV[i].n+'が'+DAIMYO[t].n+'家へ寝返った（'+facName(old)+'）'); if(old===G.player||t===G.player) G.shocks.push({type:'muhon',prov:i,old,neu:t}); }
      else { pr.owner=-1; pr.gen=null; pr.民忠=44; pr.兵=Math.floor(pr.兵*0.7); pushLog('⚑ 国一揆！'+PROV[i].n+'が独立した（'+facName(old)+'）'); if(old===G.player) G.shocks.push({type:'kuni',prov:i,old}); } } }
}

function drawShock(){
  const sh=G.shock, t=clock()-sh.t0, p=PROV[sh.prov];
  const info={ikki:['🌾 百姓一揆！','#e0a04a','兵と人口が減った'],
              ikko:['☸ 一向一揆！','#b06bff','門徒が蜂起し兵が激減した'],
              muhon:['⚑ 謀 反！','#ff5d5d',''], kuni:['⚑ 国 一 揆！','#ff8d5a',''],
              syuppon:['🚪 出 奔！','#e0a04a','']}[sh.type];
  ctx.fillStyle='rgba(0,0,0,0.74)'; ctx.fillRect(0,0,W,H);
  const cx=MAPW/2, cy=H/2, R=168, k=1+Math.min(1.4,t/420*1.4);   // 虫眼鏡ズームイン
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.clip();
  ctx.fillStyle='#0a0c14'; ctx.fillRect(cx-R,cy-R,R*2,R*2);
  ctx.translate(cx-p.x*k, cy-p.y*k); ctx.scale(k,k);
  drawMap();
  const fl=0.5+0.5*Math.sin(t/110);   // 対象国を点滅ハイライト
  ctx.beginPath(); p.poly.forEach((pt,q)=> q?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1])); ctx.closePath();
  ctx.fillStyle='rgba(255,80,60,'+(0.14+0.20*fl)+')'; ctx.fill();
  ctx.strokeStyle='rgba(255,240,200,'+(0.5+0.5*fl)+')'; ctx.lineWidth=2.5/k; ctx.stroke();
  ctx.restore();
  ctx.strokeStyle='#caa64a'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.stroke();
  ctx.strokeStyle='rgba(255,120,90,'+(0.25+0.3*Math.sin(t/150))+')'; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(cx,cy,R+9,0,TAU); ctx.stroke();
  const s2=1+Math.min(0.25,t/350*0.25); ctx.save(); ctx.translate(cx,cy-R-30); ctx.scale(s2,s2);
  ctx.textAlign='center'; ctx.fillStyle=info[1]; ctx.font='bold 40px "MS Gothic"'; ctx.fillText(info[0],0,0); ctx.restore();
  let desc='';
  if(sh.type==='muhon') desc=PROV[sh.prov].n+'が '+facName(sh.old)+(sh.old>=0?'家':'')+' から '+facName(sh.neu)+'家 へ寝返った！';
  else if(sh.type==='kuni') desc=PROV[sh.prov].n+'が '+facName(sh.old)+(sh.old>=0?'家':'')+' から独立した！';
  else if(sh.type==='syuppon') desc='守将 '+sh.gname+' が出奔した！（'+PROV[sh.prov].n+'）';
  else desc=PROV[sh.prov].n+'：'+info[2];
  ctx.textAlign='center'; ctx.font='bold 18px "MS Gothic"'; ctx.fillStyle='#ffe9a8'; ctx.fillText(desc, cx, cy+R+36);
  ctx.font='13px "MS Gothic"'; ctx.fillStyle='#9fb0c8'; ctx.fillText(sh.type==='syuppon'?'忠誠が低い武将は出奔する。「恩賞」で忠誠を上げよ':'民忠が低いと一揆・謀反が起こる（⚠印が危険信号）。「施し」で民忠を上げよ', cx, cy+R+58);
}

    return '光秀謀反！信長は脱出、光秀は出奔した'; }},
];
async function checkHist(){
  if(!G.histDone) G.histDone={};
  HIST.forEach(h=>{ if(G.year>h.y) G.histDone[h.id]=true; });   // 好機を逃した事件は起こらない
  const hev=HIST.find(h=>!G.histDone[h.id]&&G.year===h.y&&G.season>=h.s&&h.cond());
  if(!hev) return;
  G.histDone[hev.id]=true; const hd=hev.run(); pushLog('【史実】'+hev.n+'：'+hd);
  G.event={ev:{n:'【史実】'+hev.n,art:hev.art,col:hev.col},desc:hd,t0:clock()}; SFX.event();
  await sleep(2400); G.event=null;
}
function coalitionPhase(){
  const heg=hegemon(); G.heg=heg; if(heg<0) return;
  for(let f=0;f<DAIMYO.length;f++){ if(f===heg||!aliveFac(f))continue;
    G.rel[f][heg]=clamp(G.rel[f][heg]-4,-100,100); G.rel[heg][f]=G.rel[f][heg];
    for(let g=f+1;g<DAIMYO.length;g++){ if(g===heg||!aliveFac(g))continue;
      G.rel[f][g]=clamp(G.rel[f][g]+2,-100,100); G.rel[g][f]=G.rel[f][g];
      if(!G.ally[f][g] && G.rel[f][g]>=45 && Math.random()<0.25){ G.ally[f][g]=G.ally[g][f]=true; if(f===G.player||g===G.player) pushLog('⚑ 同盟成立：'+DAIMYO[f].n+'家と'+DAIMYO[g].n+'家（反'+DAIMYO[heg].n+'）'); }
    }
  }
}
async function endTurn(){
  if(busy) return; busy=true; phase='cmd'; sel=-1; coalitionPhase();
  for(let f=0;f<DAIMYO.length;f++){ if(f===G.player||!aliveFac(f)) continue;
    G.aiBanner={fac:f,t0:clock()}; await sleep(420);
    await aiTurn(f); G.aiBanner=null;
    if(state==='over'){ busy=false; return; }
  }
  seasonEvents(); applyIncome();
  for(const sh of (G.shocks||[])) await showShock(sh);   // 謀反・一揆のズーム通知
  G.shocks=[];
  G.season++; if(G.season>3){ G.season=0; G.year++; }
  await checkHist();   // 史実イベント
  if(Math.random()<0.6){ await showEvent(); }
  G.ap=playerAP(); save(); checkEnd(); busy=false;
}
function checkEnd(){
  const mine=provsOf(G.player).length;
  if(mine===0){ state='over'; G.win=false; SFX.lose(); return; }
  let others=0; for(let f=0;f<DAIMYO.length;f++) if(f!==G.player&&aliveFac(f)) others++;
  if(others===0){ state='over'; G.win=true; SFX.fanfare(); }
}

const PIMG={}; for(const k in PORTRAITS){ const im=new Image(); im.src=PORTRAITS[k]; PIMG[k]=im; }
// 武将の顔（兜＋前立て）。x,yは中心、sは倍率、colは軍の色。大将は金の三日月前立て
function drawGenFace(x,y,s,gen,col){
  const im = gen && gen.name && PIMG[gen.name];
  if(im && im.complete && im.naturalWidth){
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
    ctx.fillStyle=col; ctx.fillRect(-14,-17,28,35);          // 軍色の枠
    ctx.drawImage(im,-13,-16,26,33);
    if(gen.isLord){ ctx.fillStyle='#ffd24d'; ctx.fillRect(-14,-19,28,3); }  // 大将は金帯
    ctx.restore(); return;
  }
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle=col; ctx.fillRect(-12,9,24,6);                                    // 肩鎧
  ctx.fillStyle='#f2d2a8'; ctx.beginPath(); ctx.arc(0,2,8.5,0,TAU); ctx.fill();   // 顔
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(0,-1,10,Math.PI,0); ctx.fill(); ctx.fillRect(-10,-1,20,3);  // 兜
  ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,-1,10,Math.PI,0); ctx.stroke();
  if(gen.isLord){ ctx.fillStyle='#ffd24d'; ctx.beginPath(); ctx.moveTo(-7,-8); ctx.quadraticCurveTo(0,-19,7,-8); ctx.quadraticCurveTo(0,-12,-7,-8); ctx.fill(); }
  else if(gen.skill){ ctx.fillStyle='#e8e0c0'; ctx.fillRect(-1.5,-15,3,8); }
  ctx.fillStyle='#222'; ctx.fillRect(-5,1,3,2); ctx.fillRect(2,1,3,2);             // 目
  ctx.strokeStyle='#5a3a20'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-3,7); ctx.lineTo(3,7); ctx.stroke();  // 口髭
  ctx.restore();
}

            : '🔥 乱戦！ 連打で押し込め！（スペース/クリック）';
  ctx.fillText(label, W/2, by+22);
  const gx=bx+30, gw=bw-60, gy=by+34, gh=18;
  ctx.fillStyle='#23202a'; ctx.fillRect(gx,gy,gw,gh);
  if(a.type==='melee'||a.type==='gate'){
    const f=Math.min(1,a.hits/18);
    ctx.fillStyle=f>=1?'#ffd24d':(a.type==='gate'?'#b0885a':'#e07a4a'); ctx.fillRect(gx,gy,gw*f,gh);
    if(a.type==='gate'&&f>0.3){ ctx.strokeStyle='#3a2a18'; ctx.lineWidth=1.5; for(let c=0;c<Math.floor(f*5);c++){ const cx3=gx+30+c*(gw/5); ctx.beginPath(); ctx.moveTo(cx3,gy+2); ctx.lineTo(cx3+6,gy+9); ctx.lineTo(cx3-2,gy+16); ctx.stroke(); } }   // 門のひび
    ctx.strokeStyle='#666'; ctx.lineWidth=1; ctx.strokeRect(gx,gy,gw,gh);
  } else {
    ctx.fillStyle='rgba(120,200,255,0.25)'; ctx.fillRect(gx+gw*0.275,gy,gw*0.45,gh);   // 良ゾーン
    ctx.fillStyle='rgba(255,210,80,0.55)'; ctx.fillRect(gx+gw*0.425,gy,gw*0.15,gh);    // 会心ゾーン
    ctx.strokeStyle='#666'; ctx.lineWidth=1; ctx.strokeRect(gx,gy,gw,gh);
    const pos=(a.done&&a.pos!=null)?a.pos:markerPos(a), mx=gx+gw/2+pos*gw/2*0.96;
    ctx.fillStyle='#fff'; ctx.fillRect(mx-2,gy-4,4,gh+8);
  }
  const rem=clamp(1-t/a.dur,0,1);
  ctx.fillStyle='#3a3450'; ctx.fillRect(gx,gy+24,gw,5); ctx.fillStyle='#9fd0ff'; ctx.fillRect(gx,gy+24,gw*rem,5);
  if(a.done){
    const rt= a.type==='gate' ? ({full:'城門破壊！！',time:(a.hits>=10?'門にひび割れ！':'門は堅い…')}[a.result]||'')
            : {perfect:'会心！！',good:'良し！',miss:'外した…',full:'押し切った！！',time:(a.hits>=10?'よく押した！':'力及ばず…'),none:'好機を逃した…'}[a.result]||'';
    const col=(a.result==='perfect'||a.result==='full')?'#ffd24d':(a.result==='good'||(a.result==='time'&&a.hits>=10))?'#8dff6b':'#ff8d6b';
    const s2=1+Math.min(0.3,(clock()-a.tEnd)/300);
    ctx.save(); ctx.translate(W/2,gy+10); ctx.scale(s2,s2); ctx.fillStyle=col; ctx.font='bold 20px "MS Gothic"'; ctx.fillText(rt,0,0); ctx.restore();
  }
}
function renderTitle(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1a1410'); g.addColorStop(1,'#0a0c14'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.fillStyle='#ffd98a'; ctx.font='bold 44px "MS Gothic"'; ctx.fillText('戦 国', W/2, 88);
  ctx.fillStyle='#caa'; ctx.font='16px "MS Gothic"'; ctx.fillText('― 全国統一への道 ―  信長の野望風 戦国シミュレーション v15', W/2, 120);
  ctx.fillStyle='#9fb0c8'; ctx.font='13px "MS Gothic"'; ctx.fillText('史実イベント・攻城戦・忍者・婚姻同盟・兵種編成・武将の成長と忠誠…戦国絵巻の全部盛り！', W/2, 148);
  UI.daimyo=[]; const cols=4,bw=170,bh=46,gap=14,x0=(W-(cols*bw+(cols-1)*gap))/2,y0=186;
  DAIMYO.forEach((d,f)=>{ const bx=x0+(f%cols)*(bw+gap), by=y0+Math.floor(f/cols)*(bh+gap);
    ctx.fillStyle='#1e1a28'; ctx.fillRect(bx,by,bw,bh); ctx.strokeStyle=d.col; ctx.lineWidth=2; ctx.strokeRect(bx+1,by+1,bw-2,bh-2);
    ctx.fillStyle=d.col; ctx.beginPath(); ctx.arc(bx+22,by+bh/2,10,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 15px "MS Gothic"'; ctx.textAlign='left'; ctx.fillText(d.n+'家', bx+40, by+22);
    ctx.fillStyle='#9a8f7a'; ctx.font='10px "MS Gothic"'; ctx.fillText('本拠 '+PROV[d.start[0]].n+' / '+d.start.length+'カ国', bx+40, by+38);
    UI.daimyo.push({x:bx,y:by,w:bw,h:bh,f}); });
  if(hasSave()){ const x=W/2-90,y=H-64,w=180,h=30; ctx.fillStyle='#2a3a28'; ctx.fillRect(x,y,w,h); ctx.strokeStyle='#5a8a50'; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
    ctx.fillStyle='#cfe3a0'; ctx.font='14px "MS Gothic"'; ctx.textAlign='center'; ctx.fillText('つづきから', x+w/2, y+20); UI.cont={x,y,w,h}; } else UI.cont=null;
  ctx.fillStyle='#778'; ctx.font='11px "MS Gothic"'; ctx.textAlign='center'; ctx.fillText('大名をクリックで開始', W/2, H-22);
}
function drawEnvoy(){ const e=G.envoy, t=clock()-e.t0;
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  const pw=460,ph=230,px=(W-pw)/2,py=(H-ph)/2;
  const g=ctx.createLinearGradient(0,py,0,py+ph); g.addColorStop(0,'#2a2418'); g.addColorStop(1,'#15110a'); ctx.fillStyle=g; ctx.fillRect(px,py,pw,ph);
  ctx.strokeStyle='#caa64a'; ctx.lineWidth=3; ctx.strokeRect(px+1.5,py+1.5,pw-3,ph-3);
  ctx.textAlign='center'; ctx.fillStyle='#ffe9a8'; ctx.font='bold 26px "MS Gothic"'; ctx.fillText('降 伏 勧 告', W/2, py+44);
  ctx.fillStyle='#cdd'; ctx.font='15px "MS Gothic"'; ctx.fillText(e.foe+'の '+e.name+' へ使者を遣わす', W/2, py+72);
  // 巻物を運ぶ使者
  const mx=px+60+((t/9)%(pw-120)); ctx.fillStyle='#3a3450'; ctx.fillRect(mx-4,py+108,8,8); ctx.fillStyle='#f2d2a8'; ctx.beginPath(); ctx.arc(mx,py+102,5,0,TAU); ctx.fill();
  ctx.fillStyle='#e8dcc0'; ctx.fillRect(mx+6,py+110,16,7); ctx.strokeStyle='#a8884a'; ctx.lineWidth=1; ctx.strokeRect(mx+6,py+110,16,7);
  if(e.phase==='result'){ const col=e.res?'#ffd24d':'#ff7a6a', s=1+Math.min(0.3,t/400); ctx.save(); ctx.translate(W/2,py+ph-44); ctx.scale(s,s); ctx.fillStyle=col; ctx.font='bold 32px "MS Gothic"'; ctx.fillText(e.res?'開 城！':'拒 否…',0,0); ctx.restore();
    ctx.fillStyle='#bcd'; ctx.font='13px "MS Gothic"'; ctx.fillText(e.res?'無血にて '+e.name+' を得た':'相手は徹底抗戦の構え', W/2, py+ph-16); }
  else { ctx.fillStyle='#9a8'; ctx.font='14px "MS Gothic"'; ctx.fillText('返答を待つ…', W/2, py+ph-28); } }
function overlay(title,col,sub){ ctx.fillStyle='rgba(0,0,0,0.74)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle=col; ctx.font='bold 46px "MS Gothic"'; ctx.fillText(title,W/2,H/2-10);
  ctx.fillStyle='#ccc'; ctx.font='16px "MS Gothic"'; ctx.fillText(sub,W/2,H/2+34); }
function render(){
  ctx.fillStyle='#0a0c14'; ctx.fillRect(0,0,W,H);
  if(state==='title'){ renderTitle(); return; }
  drawMap(); if(G.march) drawMarch(); drawStatus(); drawPanel(); drawLog();
  if(state==='play') drawGenTip();
  if(G.aiBanner) drawAiBanner();
  if(state==='battle'){ if(G.battle) drawBattle(); else if(G.bigResult) drawBigResult(); }
  if(G.scene) drawScene();
  if(phase==='tacticChoose') drawTacticChooser();
  if(G.envoy) drawEnvoy();
  if(G.shock) drawShock();
  if(G.event) drawEvent();
  if(state==='over'){ if(G.win) overlay('天下統一！','#ffd24d','スペース/クリックでタイトルへ'); else overlay('滅 亡','#ff5d5d','スペース/クリックでタイトルへ'); }
}
// ── 入力 ───────────────────────────────────────────────────
function hit(r,mx,my){ return r&&mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h; }
C.addEventListener('pointermove',e=>{ const b=C.getBoundingClientRect(); mouse.x=(e.clientX-b.left)*(W/b.width); mouse.y=(e.clientY-b.top)*(H/b.height); });   // pointermove=指なぞりでもホバー詳細が出る
C.addEventListener('click',async e=>{
  SFX.ensure(); const b=C.getBoundingClientRect(); const mx=(e.clientX-b.left)*(W/b.width), my=(e.clientY-b.top)*(H/b.height);
  if(state==='title'){
    for(const d of UI.daimyo) if(hit(d,mx,my)){ newGame(d.f); state='play'; SFX.startBGM(); SFX.cmd(); return; }
    if(UI.cont&&hit(UI.cont,mx,my)){ if(load()) SFX.startBGM(); } return;
  }
  if(state==='over'){ state='title'; return; }
  if(G&&G.action){ actionInput(); return; }   // 合戦アクション中はクリック＝入力
  if(state==='battle'||busy) return;
  if(phase==='tacticChoose'){
    for(const tb of (UI.tactics||[])) if(hit(tb,mx,my)){ const ts=G.tacticSel; G.tacticSel=null; phase='cmd'; busy=true; await animBattle(ts.from,ts.to,true,tb.t); busy=false; return; }
    G.tacticSel=null; phase='cmd'; pushLog('出陣を取りやめた'); return;
  }
  if(hit(UI.end,mx,my)){ endTurn(); return; }
  for(const bt of UI.btns) if(hit(bt,mx,my)){ if(bt.diplo) doDiplo(bt.key); else doCmd(bt.key); return; }
  const pi=provAt(mx,my);
  if(pi>=0){
    if(phase==='attack'&&fromP>=0){
      if(ADJ[fromP].includes(pi)&&G.prov[pi].owner!==G.player){ if(G.ally[G.player][G.prov[pi].owner]){ pushLog('同盟国へは出陣できない（破棄が必要）'); SFX.deny(); phase='cmd'; return; } G.tacticSel={from:fromP,to:pi}; phase='tacticChoose'; SFX.sel(); pushLog('戦法を選べ（突撃＞計略＞堅守＞突撃）'); }
      else { phase='cmd'; pushLog('出陣を取りやめた'); } return;
    }
    if(phase==='move'&&fromP>=0){
      if(ADJ[fromP].includes(pi)&&G.prov[pi].owner===G.player){ const a=G.prov[fromP], d=G.prov[pi], mv=Math.floor(a.兵*0.5); a.兵-=mv; d.兵+=mv; G.ap--; pushLog(PROV[fromP].n+'→'+PROV[pi].n+' へ '+mv+' 移動'); SFX.cmd(); } phase='cmd'; return;
    }
    if(phase==='surrender'&&fromP>=0){
      const o=G.prov[pi].owner;
      if(ADJ[fromP].includes(pi)&&o!==G.player){
        if(o>=0&&G.ally[G.player][o]){ pushLog('同盟国に降伏勧告はできない'); SFX.deny(); phase='cmd'; return; }
        if(G.prov[fromP].兵 < G.prov[pi].兵*3){ pushLog('兵が3倍に満たぬ。圧倒的戦力が要る'); SFX.deny(); return; }
        phase='cmd'; await doSurrender(fromP,pi); return;
      } else { phase='cmd'; pushLog('降伏勧告を取りやめた'); } return;
    }
    sel=pi; phase='cmd'; SFX.sel();
  }
});
document.addEventListener('keydown',e=>{ SFX.ensure();
  if(e.code==='Space'&&G&&G.action){ e.preventDefault(); actionInput(); return; }   // 合戦アクション
  if(e.code==='KeyM') SFX.toggle();
  if(e.code==='KeyR') state='title';
  if(state==='over'&&(e.code==='Space'||e.code==='Enter')) state='title';
});

/* ---- v15: スマホ（Android等）対応 ---- */
(function(){
  const isTouch=('ontouchstart' in window)||(matchMedia&&matchMedia('(pointer: coarse)').matches);
  if(!isTouch) return;
  // 音・リセットのタッチボタン（キーボードM/Rの代わり）
  document.getElementById('mbtns').style.display='flex';
  document.getElementById('mSnd').addEventListener('click',()=>{ SFX.ensure(); SFX.toggle();
    document.getElementById('mSnd').textContent = document.getElementById('mSnd').textContent.startsWith('🔊')?'🔇 音':'🔊 音'; });
  document.getElementById('mRst').addEventListener('click',()=>{ if(confirm('最初からやり直しますか？')) state='title'; });
  // 画面フィット（アスペクト維持・縦横回転対応）
  function fit(){ const s=Math.min(innerWidth/1040, innerHeight*0.99/640);
    C.style.width=(1040*s)+'px'; C.style.height=(640*s)+'px'; }
  addEventListener('resize',fit);
  addEventListener('orientationchange',()=>setTimeout(fit,150));
  fit();
  // ダブルタップ拡大の抑止
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
})();
// ── サウンド（和風BGM＋SE）────────────────────────────────
const SFX=(function(){
  let ac=null,master=null,on=true,iv=null,step=0;
  const midi=n=>440*Math.pow(2,(n-69)/12);
  function tone(f,d,t,v){ if(!ac)return; const s=ac.currentTime+0.01,o=ac.createOscillator(),g=ac.createGain();
    o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0006,s+d);o.connect(g).connect(master);o.start(s);o.stop(s+d+0.03); }
  function nz(v,fr,d){ if(!ac)return; const s=ac.currentTime+0.01,b=ac.createBuffer(1,2048,ac.sampleRate),dt=b.getChannelData(0);
    for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1; const src=ac.createBufferSource();src.buffer=b;
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=fr;const g=ac.createGain();
    g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(0.001,s+d);src.connect(f).connect(g).connect(master);src.start(s);src.stop(s+d+0.05); }
  function slide(f0,f1,d,t,v){ if(!ac)return; const s=ac.currentTime+0.01,o=ac.createOscillator(),g=ac.createGain();
    o.type=t;o.frequency.setValueAtTime(f0,s);o.frequency.exponentialRampToValueAtTime(f1,s+d);
    g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(0.0006,s+d);o.connect(g).connect(master);o.start(s);o.stop(s+d+0.03); }
  const LEAD=[0,4,2,7, 9,7,4,2, 0,2,4,9, 7,4,2,0];
  const KOTO=[0,4,7,4, 0,2,4,7];
  function tick(){ if(!ac)return; const root=57;
    if(step%2===0) tone(midi(root+LEAD[step%16]),0.5,'triangle',0.06);
    if(step%2===1) tone(midi(root+12+LEAD[(step+4)%16]),0.22,'triangle',0.03);
    if(step%4===0) tone(midi(root-12),0.5,'sine',0.10);
    if(step%2===0) tone(midi(root+KOTO[step%8]),0.18,'square',0.03);
    if(step%4===0) nz(0.2,150,0.16);
    if(step%8===4) nz(0.11,140,0.12);
    step=(step+1)%16; }
  return {
    get on(){return on;},
    ensure(){ try{ if(!ac){ const A=window.AudioContext||window.webkitAudioContext; if(!A)return; ac=new A(); master=ac.createGain(); master.gain.value=on?0.24:0; master.connect(ac.destination);} if(ac.state==='suspended')ac.resume(); }catch(e){} },
    startBGM(){ this.ensure(); if(ac&&!iv){ step=0; iv=setInterval(tick,300); } },
    toggle(){ on=!on; if(master)master.gain.value=on?0.24:0; },
    sel(){ tone(660,0.05,'square',0.05); },
    cmd(){ tone(523,0.08,'triangle',0.07); tone(784,0.07,'triangle',0.04); },
    deny(){ tone(160,0.12,'sawtooth',0.06); },
    event(){ tone(880,0.1,'triangle',0.08); tone(1175,0.13,'triangle',0.06); nz(0.1,3000,0.08); },
    taiko(){ nz(0.32,150,0.2); tone(98,0.14,'sine',0.12); },
    clash(){ nz(0.42,220,0.3); for(let i=0;i<4;i++) setTimeout(()=>nz(0.22,1300,0.05),i*55); slide(180,520,0.25,'sawtooth',0.06); },
    volley(){ for(let i=0;i<6;i++) setTimeout(()=>{ nz(0.16,2600,0.04); slide(900,260,0.12,'triangle',0.03); },i*70); nz(0.2,180,0.18); },
    duel(){ nz(0.4,900,0.18); slide(240,880,0.28,'square',0.07); setTimeout(()=>{ nz(0.3,1600,0.08); tone(1046,0.18,'triangle',0.1); },420); setTimeout(()=>{ nz(0.35,1300,0.1); tone(784,0.15,'triangle',0.08); },860); },
    shock(){ nz(0.5,90,0.5); tone(98,0.5,'sine',0.14); slide(420,120,0.5,'sawtooth',0.07); setTimeout(()=>nz(0.3,700,0.2),260); },
    fanfare(){ [0,4,7,12,9,12].forEach((m,i)=>setTimeout(()=>tone(midi(69+m),0.3,'triangle',0.12),i*150)); },
    lose(){ [0,-3,-5,-8].forEach((m,i)=>setTimeout(()=>tone(midi(60+m),0.4,'sine',0.12),i*220)); },
  };
})();
// ── ループ ────────────────────────────────────────────────
function loop(){ render(); requestAnimationFrame(loop); }
state='title';
requestAnimationFrame(loop);
</script>
